# One command to get the whole warehouse:
#   docker compose up -d db
#   docker compose run --rm etl init-db
#   docker compose run --rm etl load-registry --file data/registry/anagrafica_impianti_attivi_20261102.csv
#   docker compose run --rm etl backfill --from 2025-4 --to 2026-3
#   docker compose run --rm etl load-market --start 2025-09-01 --end 2026-11-02
#   docker compose run --rm etl refresh-marts
#   docker compose run --rm etl check
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: fuel_dw
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d fuel_dw"]
      interval: 5s
      retries: 10
  etl:
    build: .
    environment:
      DATABASE_URL: postgresql://etl:etl@db:5432/fuel_dw
      DOWNLOAD_DIR: /app/data/downloads
    volumes: [downloads:/app/data/downloads]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  downloads:
